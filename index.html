<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmodle</title>
    <!-- %MAX_GUESSES% is substituted at build time from src/lib/gameConstants.ts, so this cannot drift
         from the limit the game enforces the way the old hand-written "Seven" did. -->
    <meta name="description" content="A daily guessing game about space. %MAX_GUESSES% guesses to find the mystery celestial object, narrowing down by distance, diameter, mass, temperature, orbital period and moons." />
    <link rel="canonical" href="https://cosmodle.com/" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Runs before first paint so a player who wants dark never sees a frame of cream. Kept in sync
         with useTheme.ts, which owns the same key and the same fallback to the system setting. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("cosmodle:theme")
          var dark = stored === "dark" || (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
          if (dark) document.documentElement.classList.add("dark")
        } catch (e) {}
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
